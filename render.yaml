services:
  - type: web
    name: luxeva-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: luxeva-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_USE_PREVIEW_AUTH
        value: "false"
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

  - type: web
    name: luxeva-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        fromService:
          type: web
          name: luxeva-frontend
          envVarKey: RENDER_EXTERNAL_URL
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: luxeva-redis
          property: connectionString
      - key: MONGO_URI
        sync: false
      - key: CATALOG_MONGO_URI
        sync: false
      - key: ORDER_MONGO_URI
        sync: false
      - key: CONTENT_MONGO_URI
        sync: false
      - key: NOTIFICATION_MONGO_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWO_FACTOR_API_KEY
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: ADMIN_ALERT_PHONE
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: keyvalue
    name: luxeva-redis
    plan: free
