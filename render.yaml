services:
  - type: web
    name: luxeva-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_SERVICE_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_ADMIN_EMAIL
        sync: false
      - key: MONGO_URI
        sync: false
      - key: CATALOG_MONGO_URI
        sync: false
      - key: ORDER_MONGO_URI
        sync: false
      - key: CONTENT_MONGO_URI
        sync: false
      - key: NOTIFICATION_MONGO_URI
        sync: false
      - key: PAYMENT_MONGO_URI
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: TWO_FACTOR_API_KEY
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: ADMIN_ALERT_PHONE
        sync: false
      - key: SEED_ON_START
        value: "false"
      - key: SEED_FORCE
        value: "false"
      - key: SEED_VERSION
        value: "2026-05-22"
